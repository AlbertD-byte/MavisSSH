name: 功能请求
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。

        **最好带上「现在是什么样 / 你希望变成什么样」** ——
        具体的场景比笼统的功能名更容易讨论。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 现在的做法哪里不方便
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他做法

  - type: textarea
    id: context
    attributes:
      label: 使用场景
      description: 你在什么时候会用到它
