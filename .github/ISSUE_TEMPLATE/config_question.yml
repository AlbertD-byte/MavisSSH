name: 配置
description: 编译 / 运行 / 依赖配置相关的问题
title: "[Config] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        问句也可以直接开普通 Issue —— 这个模板只是帮你把上下文写全。

  - type: textarea
    id: question
    attributes:
      label: 问题
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 环境
      description: |
        - 操作系统与版本
        - Python 版本
        - PyQt6 版本
        - 是从源码跑还是用安装包
      render: text

  - type: textarea
    id: tried
    attributes:
      label: 你已经试过什么
